services:
  # FastAPI Web Service
  - type: web
    name: codeoracle-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: codeoracle-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: codeoracle-redis
          property: connectionString
      - key: EMBEDDING_DIMENSIONS
        value: 256
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_API_KEY
        sync: false

  # Celery Background Worker
  - type: worker
    name: codeoracle-worker
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && celery -A app.workers.celery_app worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: codeoracle-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: codeoracle-redis
          property: connectionString

  # Frontend Static Site
  - type: web
    name: codeoracle-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: codeoracle-db
    databaseName: codeoracle
    user: codeoracle
    plan: free
    postgresMajorVersion: 16

  - name: codeoracle-redis
    plan: free
