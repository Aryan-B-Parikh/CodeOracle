version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codeoracle-postgres
    environment:
      POSTGRES_USER: codeoracle
      POSTGRES_PASSWORD: codeoracle
      POSTGRES_DB: codeoracle
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeoracle -d codeoracle"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codeoracle-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
