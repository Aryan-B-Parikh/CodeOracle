[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["radon", "radon.*", "networkx", "celery", "celery.*", "tiktoken", "tiktoken.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
norecursedirs = ["fixtures", "venv", ".venv"]
markers = [
    "network: tests that require network access (auto-skip when unreachable)",
    "scalability: benchmark tests that exercise the full analysis pipeline at scale",
]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:.*testclient.*:DeprecationWarning",
    "ignore:.*StarletteDeprecationWarning.*",
]
