name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codeoracle
          POSTGRES_PASSWORD: codeoracle
          POSTGRES_DB: codeoracle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeoracle -d codeoracle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://codeoracle:codeoracle@localhost:5432/codeoracle
      EMBEDDING_DIMENSIONS: "256"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check backend/app
      - name: Typecheck (mypy)
        working-directory: backend
        run: mypy app
      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Tests (pytest)
        run: pytest backend/tests
      - name: PostgreSQL + pgvector integration tests
        run: pytest backend/tests/test_pgvector.py -q

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Tests (vitest)
        run: npm run test
